[project]
name = "manet-local"
version = "1.0.0"
description = "Manet — 本地声音转写与解读的个人产品实验;Apple Silicon 全本地推理,数据不出机器"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "rennylf" }]
keywords = [
    "manet", "transcription", "asr", "whisper", "mlx", "apple-silicon",
    "meeting-notes", "subtitle", "obsidian", "local-first",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "funasr>=1.4.16",
    "kaldi-native-fbank>=1.22.3",
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",
    "mlx-whisper>=0.4.0; sys_platform == 'darwin'",
    # Windows/Linux:Whisper 走 faster-whisper(CTranslate2,CPU/CUDA)
    "faster-whisper>=1.0.3; sys_platform != 'darwin'",
]

[project.urls]
Homepage = "https://github.com/rennylf/manet-local"
Repository = "https://github.com/rennylf/manet-local"
Issues = "https://github.com/rennylf/manet-local/issues"

[tool.uv]
package = false
